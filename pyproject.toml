[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-financial-risk-engine"
version = "1.0.0"
description = "Real-Time Financial Risk & Anomaly Detection Platform"
readme = "README.md"
authors = [{ name = "Prem Lodhia", email = "prem@premlodhia.com" }]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
